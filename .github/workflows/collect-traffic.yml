name: Collect GitHub repository traffic

on:
  schedule:
    - cron: "17 1 * * *" # Daily at 06:47 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-traffic-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect traffic snapshots
        env:
          GH_TRAFFIC_STATS_TOKEN: ${{ secrets.GH_TRAFFIC_STATS_TOKEN }}
        run: python scripts/collect_traffic.py

      - name: Commit historical data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/data.json
          if git diff --cached --quiet; then
            echo "No traffic changes to commit."
          else
            git commit -m "chore(analytics): update GitHub traffic history"
            git push
          fi
