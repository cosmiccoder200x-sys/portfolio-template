name: Validate showcase PR
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const user = pr.user.login;
            const say = (body) => github.rest.issues.createComment(
              { ...context.repo, issue_number: pr.number, body });
            const fail = async (msg) => { await say('Check failed: ' + msg); core.setFailed(msg); };
            const files = await github.paginate(github.rest.pulls.listFiles,
              { ...context.repo, pull_number: pr.number });
            const touchesShowcase = files.some((f) =>
              f.filename.toLowerCase().startsWith('showcase/'));
            if (!touchesShowcase) {
              core.info('Skipping showcase validation: no showcase files changed.');
              return;
            }
            const want = `showcase/${user}.json`.toLowerCase();
            if (files.length !== 1 || files[0].filename.toLowerCase() !== want
                || files[0].status !== 'added')
              return fail(`Your PR must add exactly one new file: showcase/${user}.json`);
            const { data } = await github.rest.repos.getContent({
              owner: pr.head.repo.owner.login, repo: pr.head.repo.name,
              path: files[0].filename, ref: pr.head.sha });
            let j;
            try { j = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8')); }
            catch { return fail('The file is not valid JSON.'); }
            for (const k of ['name', 'github', 'site', 'department', 'year'])
              if (j[k] === undefined || j[k] === '') return fail(`Missing field: ${k}`);
            if (String(j.github).toLowerCase() !== user.toLowerCase())
              return fail('The "github" field must be your GitHub username.');
            const site = `https://${user}.github.io/portfolio-template/`;
            if (String(j.site).toLowerCase() !== site.toLowerCase())
              return fail(`The "site" field must be exactly ${site}`);
            const r = await fetch(site);
            if (!r.ok) return fail(`Your site is not live yet (HTTP ${r.status}). Check GitHub Pages.`);
            await github.rest.pulls.merge({ ...context.repo, pull_number: pr.number, merge_method: 'squash' });
            await say('All checks passed and your PR is merged. Welcome to the Hall of Portfolios!');