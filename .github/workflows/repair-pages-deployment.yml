name: Repair stuck GitHub Pages deployment

on:
  push:
    paths:
      - '.github/workflows/repair-pages-deployment.yml'

permissions:
  contents: read
  pages: write
  deployments: write

jobs:
  deactivate-stale-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Deactivate stale Pages deployment record
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments/7470452874/statuses" \
            -f state=inactive \
            -f description="Release stale GitHub Pages deployment lock"
          echo "Marked the stale Pages deployment inactive."
