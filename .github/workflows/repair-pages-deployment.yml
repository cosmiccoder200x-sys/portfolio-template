name: Repair stuck GitHub Pages deployment

on:
  push:
    paths:
      - '.github/workflows/repair-pages-deployment.yml'

permissions:
  contents: read
  pages: write
  deployments: write

jobs:
  remove-stale-deployment-record:
    runs-on: ubuntu-latest
    steps:
      - name: Remove inactive stale Pages deployment record
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/deployments/7470452874"
          echo "Removed inactive stale deployment record."
