<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none" aria-label="SP Contact Identity Orb">
  <defs>
    <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="65%" stop-color="#141414" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heroRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#777777"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes heroRingSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes heroCorePulse {
      0%, 100% { opacity: 0.92; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
    }
    .hero-ring-spin {
      transform-origin: 250px 250px;
      animation: heroRingSpin 36s linear infinite;
    }
    .hero-core-pulse {
      transform-origin: 250px 250px;
      animation: heroCorePulse 4s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .hero-ring-spin, .hero-core-pulse {
        animation: none !important;
      }
    }
  </style>

  <!-- Convergence Rays -->
  <line x1="30" y1="250" x2="160" y2="250" stroke="#222222" stroke-width="1.2" stroke-dasharray="2 4"/>
  <line x1="340" y1="250" x2="470" y2="250" stroke="#222222" stroke-width="1.2" stroke-dasharray="2 4"/>
  <line x1="250" y1="30" x2="250" y2="160" stroke="#222222" stroke-width="1.2" stroke-dasharray="2 4"/>
  <line x1="250" y1="340" x2="250" y2="470" stroke="#222222" stroke-width="1.2" stroke-dasharray="2 4"/>

  <!-- Ambient Glow Behind Core -->
  <circle cx="250" cy="250" r="148" fill="url(#heroGlow)"/>

  <!-- Outer Focal Ring with Dash Sequence and Satellites -->
  <g class="hero-ring-spin">
    <circle cx="250" cy="250" r="128" stroke="#333333" stroke-width="1.2" stroke-dasharray="8 6"/>
    <circle cx="250" cy="250" r="110" stroke="#EDEDED" stroke-width="0.9" stroke-opacity="0.38" stroke-dasharray="2 6"/>
    <circle cx="378" cy="250" r="4.5" fill="#EDEDED" filter="url(#dotGlow)"/>
    <circle cx="122" cy="250" r="4.5" fill="#EDEDED" filter="url(#dotGlow)"/>
  </g>

  <!-- Central SP Emblem Sphere -->
  <g class="hero-core-pulse">
    <circle cx="250" cy="250" r="75" fill="#141414" stroke="url(#heroRim)" stroke-width="2.4"/>
    <circle cx="250" cy="250" r="59" fill="#080808" stroke="#262626" stroke-width="1.2"/>
    <!-- SP Monogram Typography -->
    <text x="250" y="265" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-1">SP</text>
  </g>
</svg>
