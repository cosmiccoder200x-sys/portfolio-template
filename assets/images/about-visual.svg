<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%" fill="none" aria-label="Abstract Technical Architecture and Problem Solving Schematic">
  <defs>
    <pattern id="aboutGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#222222" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="32" cy="32" r="1" fill="#444444" fill-opacity="0.8"/>
    </pattern>
    <linearGradient id="aboutGradLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#888888" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#222222" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="aboutGradSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181818" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0c0c0c" stop-opacity="0.95"/>
    </linearGradient>
    <clipPath id="aboutClip">
      <rect x="0" y="0" width="640" height="400" rx="4"/>
    </clipPath>
  </defs>

  <style>
    @keyframes drawPath {
      from { stroke-dashoffset: 600; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes pulseNode {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.5); }
    }
    @keyframes flowPulse {
      0% { stroke-dashoffset: 24; }
      100% { stroke-dashoffset: 0; }
    }
    .grid-bg {
      opacity: 0.85;
    }
    .drawn-line {
      stroke-dasharray: 600;
      stroke-dashoffset: 0;
      animation: drawPath 3.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .flow-line {
      stroke-dasharray: 4 4;
      animation: flowPulse 2s linear infinite;
    }
    .pulse-dot {
      animation: pulseNode 3s ease-in-out infinite;
      transform-origin: center;
    }
    .mono-label {
      font-family: 'DM Mono', monospace;
      font-size: 8px;
      letter-spacing: 0.12em;
      fill: #777777;
    }
    .active-label {
      fill: #EDEDED;
      font-weight: 600;
    }
    @media (prefers-reduced-motion: reduce) {
      .drawn-line, .flow-line, .pulse-dot {
        animation: none !important;
        stroke-dashoffset: 0 !important;
      }
    }
  </style>

  <g clip-path="url(#aboutClip)">
    <!-- Base Background Grid -->
    <rect width="640" height="400" fill="#0c0c0c"/>
    <rect width="640" height="400" fill="url(#aboutGrid)" class="grid-bg"/>

    <!-- Coordinate Framing & Boundary -->
    <rect x="24" y="24" width="592" height="352" stroke="#262626" stroke-width="1"/>
    <line x1="24" y1="56" x2="616" y2="56" stroke="#1f1f1f" stroke-width="1"/>
    <line x1="24" y1="344" x2="616" y2="344" stroke="#1f1f1f" stroke-width="1"/>

    <!-- Header Telemetry Bar -->
    <text x="36" y="44" class="mono-label">SYS // REPO_ARCHITECTURE</text>
    <text x="240" y="44" class="mono-label">ALGORITHM_GRAPH: O(N_LOG_N)</text>
    <text x="510" y="44" class="mono-label active-label">INTEGRITY // 100%</text>

    <!-- Isometric Architecture Blocks -->
    <!-- Node 1: Input / Ingestion Layer -->
    <g transform="translate(60, 110)">
      <rect x="0" y="0" width="130" height="68" rx="2" fill="url(#aboutGradSurface)" stroke="#3a3a3a" stroke-width="1"/>
      <text x="14" y="26" class="mono-label active-label">01 // INGESTION</text>
      <text x="14" y="44" class="mono-label">DATA CONTRACTS</text>
      <text x="14" y="56" class="mono-label">STREAM PROTOCOLS</text>
      <circle cx="118" cy="34" r="3" fill="#EDEDED" class="pulse-dot"/>
    </g>

    <!-- Node 2: Core Processing / Neural Engine -->
    <g transform="translate(255, 160)">
      <rect x="0" y="0" width="145" height="88" rx="2" fill="url(#aboutGradSurface)" stroke="#EDEDED" stroke-width="1.2"/>
      <line x1="0" y1="28" x2="145" y2="28" stroke="#333333" stroke-width="1"/>
      <text x="14" y="19" class="mono-label active-label">02 // CORE ENGINE</text>
      <text x="14" y="48" class="mono-label">VECTOR EMBEDDINGS</text>
      <text x="14" y="62" class="mono-label">RETRIEVAL &amp; RESCALE</text>
      <text x="14" y="76" class="mono-label">LATENCY &lt; 14MS</text>
      <circle cx="132" cy="14" r="4" fill="#ffffff" class="pulse-dot"/>
    </g>

    <!-- Node 3: Synthesis / Output Delivery -->
    <g transform="translate(460, 220)">
      <rect x="0" y="0" width="130" height="68" rx="2" fill="url(#aboutGradSurface)" stroke="#3a3a3a" stroke-width="1"/>
      <text x="14" y="26" class="mono-label active-label">03 // SYNTHESIS</text>
      <text x="14" y="44" class="mono-label">ZERO-COPY IPC</text>
      <text x="14" y="56" class="mono-label">CLIENT APIS / MCP</text>
      <circle cx="118" cy="34" r="3" fill="#888888"/>
    </g>

    <!-- Interconnecting Pipelines / Vectors -->
    <!-- Pipe 1 -> 2 -->
    <path d="M 190 144 L 222 144 L 222 204 L 255 204" stroke="url(#aboutGradLine)" stroke-width="1.5" fill="none" class="drawn-line"/>
    <path d="M 190 144 L 222 144 L 222 204 L 255 204" stroke="#ffffff" stroke-width="1.5" fill="none" class="flow-line"/>

    <!-- Pipe 2 -> 3 -->
    <path d="M 400 204 L 430 204 L 430 254 L 460 254" stroke="url(#aboutGradLine)" stroke-width="1.5" fill="none" class="drawn-line"/>
    <path d="M 400 204 L 430 204 L 430 254 L 460 254" stroke="#ffffff" stroke-width="1.5" fill="none" class="flow-line"/>

    <!-- Feedback Loop / Verification Back-propagation -->
    <path d="M 525 220 L 525 100 L 327 100 L 327 160" stroke="#444444" stroke-width="1" stroke-dasharray="2 4" fill="none"/>
    <circle cx="426" cy="100" r="2.5" fill="#777777"/>
    <text x="434" y="96" class="mono-label">VERIFY LOOP</text>

    <!-- Geometric Radar & Calibration Reticle -->
    <g transform="translate(100, 260)">
      <circle cx="40" cy="40" r="34" stroke="#222222" stroke-width="1" stroke-dasharray="4 4"/>
      <circle cx="40" cy="40" r="20" stroke="#333333" stroke-width="0.75"/>
      <line x1="6" y1="40" x2="74" y2="40" stroke="#282828" stroke-width="0.75"/>
      <line x1="40" y1="6" x2="40" y2="74" stroke="#282828" stroke-width="0.75"/>
      <circle cx="40" cy="40" r="2" fill="#EDEDED"/>
      <text x="0" y="86" class="mono-label">CALIBRATION // ZERO_DRIFT</text>
    </g>

    <!-- Bottom Metric Axis -->
    <text x="36" y="362" class="mono-label">X: +128.40  Y: -042.88</text>
    <text x="260" y="362" class="mono-label">PRECISION_ENGINEERING // V26</text>
    <text x="510" y="362" class="mono-label">STATUS // COMPILED</text>
  </g>
</svg>

