<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="100%" height="100%" fill="none" aria-label="SP Contact Closing Identity Visual">
  <defs>
    <radialGradient id="contactGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#141414" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="contactRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#777777"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes contactRotateSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes contactPulse {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
    }
    .contact-ring-spin {
      transform-origin: 240px 145px;
      animation: contactRotateSlow 36s linear infinite;
    }
    .contact-core-pulse {
      transform-origin: 240px 145px;
      animation: contactPulse 4s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .contact-ring-spin, .contact-core-pulse {
        animation: none !important;
      }
    }
  </style>

  <rect width="480" height="320" fill="#0c0c0c" rx="4"/>
  <rect x="14" y="14" width="452" height="292" stroke="#1f1f1f" stroke-width="1" rx="2"/>

  <!-- Subtle Corner Crosshairs -->
  <path d="M 24 34 L 34 34 L 34 24" stroke="#444" stroke-width="0.75" fill="none"/>
  <path d="M 456 34 L 446 34 L 446 24" stroke="#444" stroke-width="0.75" fill="none"/>
  <path d="M 24 286 L 34 286 L 34 296" stroke="#444" stroke-width="0.75" fill="none"/>
  <path d="M 456 286 L 446 286 L 446 296" stroke="#444" stroke-width="0.75" fill="none"/>

  <!-- Convergence Rays -->
  <line x1="60" y1="145" x2="160" y2="145" stroke="#222" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="320" y1="145" x2="420" y2="145" stroke="#222" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="240" y1="35" x2="240" y2="85" stroke="#222" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="240" y1="205" x2="240" y2="255" stroke="#222" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- Ambient Glow Behind Core -->
  <circle cx="240" cy="145" r="95" fill="url(#contactGlow)"/>

  <!-- Outer Focal Ring with Dash Sequence -->
  <g class="contact-ring-spin">
    <circle cx="240" cy="145" r="82" stroke="#333333" stroke-width="1" stroke-dasharray="8 6"/>
    <circle cx="240" cy="145" r="70" stroke="#EDEDED" stroke-width="0.8" stroke-opacity="0.35" stroke-dasharray="2 6"/>
    <circle cx="322" cy="145" r="3" fill="#EDEDED"/>
    <circle cx="158" cy="145" r="3" fill="#EDEDED"/>
  </g>

  <!-- Central SP Emblem Sphere -->
  <g class="contact-core-pulse">
    <circle cx="240" cy="145" r="48" fill="#141414" stroke="url(#contactRim)" stroke-width="1.5"/>
    <circle cx="240" cy="145" r="38" fill="#0a0a0a" stroke="#262626" stroke-width="1"/>
    <!-- SP Monogram Typography -->
    <text x="240" y="154" text-anchor="middle" font-family="'Manrope', 'Montserrat', sans-serif" font-size="28" font-weight="800" fill="#EDEDED" letter-spacing="-1">SP</text>
  </g>

  <!-- Bottom Coordinates & Identity Text -->
  <text x="240" y="258" text-anchor="middle" font-family="'DM Mono', monospace" font-size="9" font-weight="600" fill="#EDEDED" letter-spacing="0.14em">SREERANG P. // INITIATE TRANSMISSION</text>
  <text x="240" y="274" text-anchor="middle" font-family="'DM Mono', monospace" font-size="7.5" fill="#666666" letter-spacing="0.08em">OPEN FOR SOFTWARE · AI · FDE ROLES</text>
</svg>

