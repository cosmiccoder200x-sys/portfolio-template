<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" height="100%" fill="none" aria-label="FocusFlow Chrome Productivity and Distraction Blocker Extension Schematic">
  <defs>
    <linearGradient id="ffRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#888888"/>
      <stop offset="100%" stop-color="#333333"/>
    </linearGradient>
  </defs>
  <rect width="540" height="320" fill="#090909" rx="4"/>
  <rect x="16" y="16" width="508" height="288" stroke="#222222" stroke-width="1" rx="2"/>

  <!-- Header -->
  <line x1="16" y1="52" x2="524" y2="52" stroke="#1f1f1f" stroke-width="1"/>
  <text x="32" y="38" font-family="'DM Mono', monospace" font-size="9" fill="#EDEDED" font-weight="600" letter-spacing="0.1em">FOCUSFLOW // CHROME EXTENSION</text>
  <text x="508" y="38" text-anchor="end" font-family="'DM Mono', monospace" font-size="8" fill="#777777">CHROME APIS · POMODORO · BLOCKER</text>

  <!-- Left: Pomodoro Circular Timer Gauge -->
  <g transform="translate(40, 72)">
    <rect width="180" height="135" fill="#111111" stroke="#2a2a2a" stroke-width="0.8" rx="2"/>
    <text x="16" y="24" font-family="'DM Mono', monospace" font-size="8" fill="#EDEDED">SESSION DIAL: POMODORO</text>
    
    <g transform="translate(90, 80)">
      <!-- Background track -->
      <circle cx="0" cy="0" r="42" stroke="#222222" stroke-width="5" fill="none"/>
      <!-- Active arc (25 mins / 75% complete) -->
      <circle cx="0" cy="0" r="42" stroke="url(#ffRing)" stroke-width="5" fill="none" stroke-dasharray="264" stroke-dashoffset="66" stroke-linecap="round" transform="rotate(-90)"/>
      <text x="0" y="5" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="16" font-weight="800" fill="#EDEDED">18:42</text>
      <text x="0" y="20" text-anchor="middle" font-family="'DM Mono', monospace" font-size="6.5" fill="#777">DEEP WORK</text>
    </g>
  </g>

  <!-- Right: Distraction Filter & Analytics Histogram -->
  <g transform="translate(236, 72)">
    <rect width="272" height="135" fill="#111111" stroke="#2a2a2a" stroke-width="0.8" rx="2"/>
    <text x="16" y="24" font-family="'DM Mono', monospace" font-size="8" fill="#EDEDED">REAL-TIME DOMAIN SHIELD</text>
    <text x="256" y="24" text-anchor="end" font-family="'DM Mono', monospace" font-size="7" fill="#777">FILTER STATUS: ACTIVE</text>

    <!-- Blocked stats list -->
    <g transform="translate(16, 42)">
      <rect y="0" width="240" height="24" fill="#161616" stroke="#222" stroke-width="0.6" rx="2"/>
      <text x="10" y="16" font-family="'DM Mono', monospace" font-size="7.5" fill="#EDEDED">SOCIAL FEEDS</text>
      <text x="230" y="16" text-anchor="end" font-family="'DM Mono', monospace" font-size="7.5" fill="#888">BLOCKED · 48 ATTEMPTS</text>

      <rect y="30" width="240" height="24" fill="#161616" stroke="#222" stroke-width="0.6" rx="2"/>
      <text x="10" y="46" font-family="'DM Mono', monospace" font-size="7.5" fill="#EDEDED">ALGORITHM RECOMMENDERS</text>
      <text x="230" y="46" text-anchor="end" font-family="'DM Mono', monospace" font-size="7.5" fill="#888">MUTED · ZERO POPUPS</text>

      <rect y="60" width="240" height="24" fill="#161616" stroke="#222" stroke-width="0.6" rx="2"/>
      <text x="10" y="76" font-family="'DM Mono', monospace" font-size="7.5" fill="#EDEDED">TAB USAGE TELEMETRY</text>
      <text x="230" y="76" text-anchor="end" font-family="'DM Mono', monospace" font-size="7.5" fill="#EDEDED">EXPORTED .JSON</text>
    </g>
  </g>

  <!-- Bottom Metric Bar -->
  <g transform="translate(32, 224)">
    <rect width="476" height="60" fill="#111111" stroke="#222222" stroke-width="0.8" rx="2"/>
    <text x="20" y="24" font-family="'DM Mono', monospace" font-size="7.5" fill="#777777">DAILY FOCUS SCORE</text>
    <text x="20" y="46" font-family="'DM Mono', monospace" font-size="13" font-weight="700" fill="#EDEDED">94.2 / 100 PTS</text>
    
    <line x1="165" y1="12" x2="165" y2="48" stroke="#222222" stroke-width="1"/>
    <text x="185" y="24" font-family="'DM Mono', monospace" font-size="7.5" fill="#777777">DISTRACTIONS DEFLECTED</text>
    <text x="185" y="46" font-family="'DM Mono', monospace" font-size="13" font-weight="700" fill="#EDEDED">120+ TODAY</text>
    
    <line x1="350" y1="12" x2="350" y2="48" stroke="#222222" stroke-width="1"/>
    <text x="370" y="24" font-family="'DM Mono', monospace" font-size="7.5" fill="#777777">ARCHITECTURE</text>
    <text x="370" y="46" font-family="'DM Mono', monospace" font-size="13" font-weight="700" fill="#ffffff">MANIFEST V3</text>
  </g>
</svg>

