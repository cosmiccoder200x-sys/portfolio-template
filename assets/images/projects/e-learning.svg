<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" height="100%" fill="none" aria-label="E-Learning Full-Stack Platform Schematic">
  <defs>
    <linearGradient id="elGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EDEDED"/>
      <stop offset="100%" stop-color="#555555"/>
    </linearGradient>
  </defs>
  <rect width="540" height="320" fill="#090909" rx="4"/>
  <rect x="16" y="16" width="508" height="288" stroke="#222222" stroke-width="1" rx="2"/>

  <!-- Header -->
  <line x1="16" y1="52" x2="524" y2="52" stroke="#1f1f1f" stroke-width="1"/>
  <text x="32" y="38" font-family="'DM Mono', monospace" font-size="9" fill="#EDEDED" font-weight="600" letter-spacing="0.1em">E-LEARNING // FULL-STACK PLATFORM</text>
  <text x="508" y="38" text-anchor="end" font-family="'DM Mono', monospace" font-size="8" fill="#777777">REACT · FLASK · SUPABASE · POSTGRES</text>

  <!-- Left: Live Class Session & Submission Queue -->
  <g transform="translate(32, 70)">
    <rect width="230" height="135" fill="#111111" stroke="#2a2a2a" stroke-width="0.8" rx="2"/>
    <text x="16" y="24" font-family="'DM Mono', monospace" font-size="8" fill="#EDEDED">LIVE CLASSROOM &amp; SUBMISSIONS</text>
    
    <!-- Timeline queue items -->
    <g transform="translate(16, 40)">
      <circle cx="6" cy="10" r="4" fill="#ffffff"/>
      <text x="18" y="14" font-family="'DM Mono', monospace" font-size="7.5" fill="#EDEDED">LIVE WEBINAR: NEURAL NETWORKS</text>
      <line x1="6" y1="18" x2="6" y2="40" stroke="#333" stroke-width="1"/>

      <circle cx="6" cy="44" r="4" fill="#888888"/>
      <text x="18" y="48" font-family="'DM Mono', monospace" font-size="7.5" fill="#AAAAAA">ASSIGNMENT 04: CNN BACKPROP</text>
      <line x1="6" y1="52" x2="6" y2="74" stroke="#333" stroke-width="1"/>

      <circle cx="6" cy="78" r="4" fill="#555555"/>
      <text x="18" y="82" font-family="'DM Mono', monospace" font-size="7.5" fill="#777777">AUTOMATED GRADING &amp; RUBRIC</text>
    </g>
  </g>

  <!-- Right: Supabase Database Schema Relation -->
  <g transform="translate(278, 70)">
    <rect width="230" height="135" fill="#111111" stroke="#333333" stroke-width="0.8" rx="2"/>
    <text x="16" y="24" font-family="'DM Mono', monospace" font-size="8" fill="#EDEDED">POSTGRES SCHEMA MATRIX</text>
    <text x="214" y="24" text-anchor="end" font-family="'DM Mono', monospace" font-size="7" fill="#777">RLS POLICIES</text>

    <!-- Schema Tables -->
    <g transform="translate(16, 40)">
      <rect width="198" height="22" fill="#181818" stroke="#333" stroke-width="0.6" rx="1"/>
      <text x="8" y="15" font-family="'DM Mono', monospace" font-size="7" fill="#EDEDED">tbl_users [id, role, auth_uid]</text>

      <rect y="28" width="198" height="22" fill="#181818" stroke="#333" stroke-width="0.6" rx="1"/>
      <text x="8" y="43" font-family="'DM Mono', monospace" font-size="7" fill="#EDEDED">tbl_courses [id, instructor_id, syllabus]</text>

      <rect y="56" width="198" height="22" fill="#181818" stroke="#333" stroke-width="0.6" rx="1"/>
      <text x="8" y="71" font-family="'DM Mono', monospace" font-size="7" fill="#EDEDED">tbl_submissions [id, score, status]</text>
    </g>
  </g>

  <!-- Bottom Metric Bar -->
  <g transform="translate(32, 222)">
    <rect width="476" height="62" fill="#111111" stroke="#222222" stroke-width="0.8" rx="2"/>
    <text x="20" y="24" font-family="'DM Mono', monospace" font-size="7.5" fill="#777777">AUTHENTICATION</text>
    <text x="20" y="46" font-family="'DM Mono', monospace" font-size="13" font-weight="700" fill="#EDEDED">JWT &amp; SUPABASE RLS</text>
    
    <line x1="165" y1="12" x2="165" y2="50" stroke="#222222" stroke-width="1"/>
    <text x="185" y="24" font-family="'DM Mono', monospace" font-size="7.5" fill="#777777">API BACKEND</text>
    <text x="185" y="46" font-family="'DM Mono', monospace" font-size="13" font-weight="700" fill="#EDEDED">PYTHON FLASK REST</text>
    
    <line x1="350" y1="12" x2="350" y2="50" stroke="#222222" stroke-width="1"/>
    <text x="370" y="24" font-family="'DM Mono', monospace" font-size="7.5" fill="#777777">FRONTEND STACK</text>
    <text x="370" y="46" font-family="'DM Mono', monospace" font-size="13" font-weight="700" fill="#ffffff">REACT 18 + VITE</text>
  </g>
</svg>

