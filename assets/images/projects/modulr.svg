<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" height="100%" fill="none" aria-label="Modulr Adaptive Exam Learning Platform Schematic">
  <defs>
    <linearGradient id="mCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="mBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#777777"/>
    </linearGradient>
  </defs>
  <rect width="540" height="320" fill="#090909" rx="4"/>
  <rect x="16" y="16" width="508" height="288" stroke="#222222" stroke-width="1" rx="2"/>

  <!-- Header -->
  <line x1="16" y1="52" x2="524" y2="52" stroke="#1f1f1f" stroke-width="1"/>
  <text x="32" y="38" font-family="'DM Mono', monospace" font-size="9" fill="#EDEDED" font-weight="600" letter-spacing="0.1em">MODULR // ADAPTIVE EXAM PLATFORM</text>
  <text x="508" y="38" text-anchor="end" font-family="'DM Mono', monospace" font-size="8" fill="#777777">KTU · NEXT.JS · VITEST</text>

  <!-- Left: Syllabus Modules Grid -->
  <g transform="translate(32, 68)">
    <rect width="210" height="42" fill="url(#mCardGrad)" stroke="#333333" stroke-width="0.8" rx="2"/>
    <text x="14" y="20" font-family="'DM Mono', monospace" font-size="8.5" fill="#EDEDED">MODULE 01: DIGITAL LOGIC</text>
    <rect x="14" y="28" width="180" height="4" fill="#1f1f1f" rx="1"/>
    <rect x="14" y="28" width="144" height="4" fill="url(#mBarGrad)" rx="1"/>
    <text x="198" y="22" text-anchor="end" font-family="'DM Mono', monospace" font-size="7" fill="#888">80%</text>

    <rect y="50" width="210" height="42" fill="url(#mCardGrad)" stroke="#222222" stroke-width="0.8" rx="2"/>
    <text x="14" y="70" font-family="'DM Mono', monospace" font-size="8.5" fill="#AAAAAA">MODULE 02: COMPUTER ARCH</text>
    <rect x="14" y="78" width="180" height="4" fill="#1f1f1f" rx="1"/>
    <rect x="14" y="78" width="117" height="4" fill="url(#mBarGrad)" rx="1"/>
    <text x="198" y="72" text-anchor="end" font-family="'DM Mono', monospace" font-size="7" fill="#888">65%</text>

    <rect y="100" width="210" height="42" fill="url(#mCardGrad)" stroke="#222222" stroke-width="0.8" rx="2"/>
    <text x="14" y="120" font-family="'DM Mono', monospace" font-size="8.5" fill="#888888">MODULE 03: SIGNALS &amp; NETWORKS</text>
    <rect x="14" y="128" width="180" height="4" fill="#1f1f1f" rx="1"/>
    <rect x="14" y="128" width="162" height="4" fill="url(#mBarGrad)" rx="1"/>
    <text x="198" y="122" text-anchor="end" font-family="'DM Mono', monospace" font-size="7" fill="#888">90%</text>
  </g>

  <!-- Right: Question & Error Analytics Radar -->
  <g transform="translate(266, 68)">
    <rect width="242" height="142" fill="url(#mCardGrad)" stroke="#333333" stroke-width="0.8" rx="2"/>
    <text x="16" y="24" font-family="'DM Mono', monospace" font-size="8.5" fill="#EDEDED">PREVIOUS YEAR QUESTIONS</text>
    <text x="16" y="38" font-family="'DM Mono', monospace" font-size="7" fill="#777777">QUESTION RETRIEVAL &amp; MISTAKE LOG</text>

    <!-- Question Frequency Histogram -->
    <g transform="translate(16, 52)">
      <line x1="0" y1="56" x2="210" y2="56" stroke="#262626" stroke-width="1"/>
      <rect x="10" y="24" width="16" height="32" fill="#EDEDED" rx="1"/>
      <rect x="36" y="12" width="16" height="44" fill="#EDEDED" rx="1"/>
      <rect x="62" y="30" width="16" height="26" fill="#888888" rx="1"/>
      <rect x="88" y="18" width="16" height="38" fill="#EDEDED" rx="1"/>
      <rect x="114" y="38" width="16" height="18" fill="#555555" rx="1"/>
      <rect x="140" y="8"  width="16" height="48" fill="#ffffff" rx="1"/>
      <rect x="166" y="22" width="16" height="34" fill="#888888" rx="1"/>
      <text x="14" y="70" font-family="'DM Mono', monospace" font-size="6.5" fill="#555">2019</text>
      <text x="66" y="70" font-family="'DM Mono', monospace" font-size="6.5" fill="#555">2021</text>
      <text x="118" y="70" font-family="'DM Mono', monospace" font-size="6.5" fill="#555">2023</text>
      <text x="170" y="70" font-family="'DM Mono', monospace" font-size="6.5" fill="#555">2025</text>
    </g>
  </g>

  <!-- Bottom Metric Bar -->
  <g transform="translate(32, 230)">
    <rect width="476" height="54" fill="#111111" stroke="#222222" stroke-width="0.8" rx="2"/>
    <text x="18" y="24" font-family="'DM Mono', monospace" font-size="7.5" fill="#777777">ACTIVE SESSIONS</text>
    <text x="18" y="42" font-family="'DM Mono', monospace" font-size="12" font-weight="700" fill="#EDEDED">1,420+ QUERIES</text>
    <line x1="160" y1="12" x2="160" y2="42" stroke="#222222" stroke-width="1"/>
    <text x="178" y="24" font-family="'DM Mono', monospace" font-size="7.5" fill="#777777">MASTERY ACCELERATION</text>
    <text x="178" y="42" font-family="'DM Mono', monospace" font-size="12" font-weight="700" fill="#EDEDED">+34.8% RETENTION</text>
    <line x1="340" y1="12" x2="340" y2="42" stroke="#222222" stroke-width="1"/>
    <text x="358" y="24" font-family="'DM Mono', monospace" font-size="7.5" fill="#777777">DEPLOYMENT</text>
    <text x="358" y="42" font-family="'DM Mono', monospace" font-size="12" font-weight="700" fill="#ffffff">VERCEL EDGE</text>
  </g>
</svg>

